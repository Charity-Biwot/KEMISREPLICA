<div class="login-page">

  <!-- Left welcome panel -->
  <section class="welcome-panel">
    <a class="back-home" routerLink="/">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>

    <div class="welcome-content">
      <img
        class="coat"
        src="/images/image.png"
        alt="Kenya Coat of Arms"
        width="110"
        style="display:block; width:110px !important; max-width:110px !important; height:auto; margin:0 auto 18px;"
      />
      <h1>Welcome Back</h1>
      <p class="desc">
        Access your education management portal to streamline learning and administrative processes.
      </p>
      <div class="ministry">
        <span>Ministry of Education</span>
        <small>Republic of Kenya</small>
      </div>
    </div>
  </section>

  <!-- Right login section -->
  <section class="login-section">
    <img class="bg-photo" src="/images/image.jpeg
    " alt="" />

    <div class="login-card">
      <h2>Login</h2>
      <p class="subtitle">Enter your credentials to continue</p>

      <form (ngSubmit)="submitLogin()" #loginForm="ngForm">

        <div class="form-group">
          <label for="email">Email ID</label>
          <div class="input-group">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
            </span>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              email
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </span>
            <input
              #pwd
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
            />
            <button type="button" class="eye" aria-label="Show or hide password"
                    (click)="pwd.type = pwd.type === 'password' ? 'text' : 'password'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <span class="forgot-password">Forgot password?</span>
        </div>

        <button
          type="submit"
          class="login-btn"
          [disabled]="loginForm.invalid || isSubmitting"
        >
          {{ isSubmitting ? 'Signing in...' : 'Login' }}
        </button>

        <p class="message" *ngIf="message">{{ message }}</p>
      </form>

      <div class="card-footer">
        <a class="onboarding-link" routerLink="/institution-onboarding">Institution Onboarding</a>
        <p>Need help? <strong>Contact Support</strong></p>
      </div>
    </div>

    <button class="chat-fab" type="button" aria-label="Chat">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
    </button>
  </section>

</div>
